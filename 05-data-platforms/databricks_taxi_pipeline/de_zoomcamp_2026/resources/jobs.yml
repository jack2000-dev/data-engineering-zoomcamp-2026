resources:
  jobs:
    ingest_taxi_job:
      name: Ingest NYC Taxi Data
      tasks:
        - task_key: ingest_task
          spark_python_task:
            python_file: ../src/ingest_taxi.py
          environment_key: serverless_env
      environments:
        - environment_key: serverless_env
          spec:
            client: "2"